      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&family=Sora:wght@500;800&display=swap"
      rel="stylesheet"

    <style>:root{color-scheme:dark}*{box-sizing:border-box}body{color:#e9e6ee;background:#0a0a0c;max-width:1100px;margin:0 auto;padding:24px 18px 80px;font:15px/1.55 Inter,system-ui,sans-serif}h1{margin:0 0 4px;font-family:Sora,sans-serif;font-size:21px}h2{margin:26px 0 10px;font-family:Sora,sans-serif;font-size:15px}.tenue{color:#9b93a8;font-size:12.5px;font-weight:400}.barra{border:1px solid #2a2730;border-radius:14px;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0;padding:12px 14px;display:flex}select,input[type=file],button{font:inherit;color:inherit;background:#16141b;border:1px solid #2a2730;border-radius:9px;padding:7px 10px;font-size:13px}button.principal{color:#200311;cursor:pointer;background:#ff4fa3;border:0;font-weight:700}button.principal:disabled{color:#6d667a;cursor:default;background:#2a2730}#estado{color:#ff4fa3;min-height:22px;margin:10px 0;font-weight:700}#registro{color:#7d7590;margin-top:14px;font-family:ui-monospace,monospace;font-size:11.5px}.editor{grid-template-columns:1.35fr 1fr;align-items:start;gap:16px;display:grid}@media (width<=820px){.editor{grid-template-columns:1fr}}.lienzo{background:#000;border-radius:12px;position:relative;overflow:hidden}.lienzo video{width:100%;height:auto;display:block}.capa{pointer-events:none;position:absolute;inset:0}.panel{border:1px solid #2a2730;border-radius:14px;padding:12px 14px}.estilos{flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;display:flex}.etiq{color:#9b93a8;margin-right:4px;font-size:11.5px}.chip{cursor:pointer;color:#b9b2c6;background:#16141b;border:1px solid #2a2730;border-radius:999px;padding:6px 12px;font-size:12.5px}.chip.on{color:#200311;background:#ff4fa3;border-color:#ff4fa3;font-weight:700}.mandos{border-top:1px solid #23202b;gap:9px;padding-top:12px;display:grid}.mandos label{color:#b9b2c6;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;display:flex}.mandos label.check{justify-content:flex-start;gap:8px}.mandos input[type=color]{background:#16141b;border:1px solid #2a2730;border-radius:6px;width:40px;height:26px;padding:2px}.mandos input[type=range]{accent-color:#ff4fa3;width:130px}.mandos input[type=checkbox]{accent-color:#ff4fa3;width:16px;height:16px}.lineas{border:1px solid #23202b;border-radius:12px;max-height:320px;overflow:auto}.linea{border-bottom:1px solid #1a1821;gap:10px;padding:7px 10px;display:flex}.linea:last-child{border-bottom:0}.linea.on{background:#ff4fa31a}.tiempo{color:#ff4fa3;cursor:pointer;background:0 0;border:0;flex:none;padding:2px 4px;font-family:ui-monospace,monospace;font-size:11.5px}.texto{border-radius:6px;outline:none;flex:1;padding:2px 6px;font-size:13.5px}.texto:focus{background:#16141b}</style>
    <script type="module" crossorigin src="./index-qyttZvNw.js"></script>
  </head>
  <body>
    <h1>Subtítulos</h1>
    <p class="tenue">
      Suelta un vídeo. Se transcribe en tu propio ordenador — no se sube nada a ningún
      sitio — y lo tienes aquí para corregirlo y elegir cómo se ven las letras.
    </p>

    <div class="barra">
      <input id="archivo" type="file" accept="video/*,audio/*" />
      <select id="modelo">
        <option value="onnx-community/whisper-base_timestamped">calidad normal</option>
        <option value="onnx-community/whisper-tiny_timestamped">rápido</option>
        <option value="onnx-community/whisper-small_timestamped">la mejor, más lento</option>
      </select>
      <select id="idioma">
        <option value="spanish">español</option>
        <option value="english">inglés</option>
      </select>
      <select id="aparato" hidden>
        <option value="webgpu">gráfica</option>
        <option value="wasm">procesador</option>
      </select>
      <span class="tenue" id="grafica">…</span>
      <button id="descargar" class="principal" disabled>Descargar .srt</button>
    </div>

    <div id="estado"></div>
    <div id="resultado"></div>
    <div id="editor"></div>
    <div id="registro"></div>

  </body>
</html>
