<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/favicon-180.png" />
    <meta
      name="description"
      content="CleanFrame elimina las marcas de agua de las imagenes y videos generados con Gemini y Veo, directamente en tu navegador. Tus archivos nunca salen de tu dispositivo."
    />
    <style>
      /* El pie de Neeko Studio va abajo del todo (#neeko-footer). Se oculta el
         enlace suelto que ya pintaba la aplicación, para no repetirlo. */
      #root footer {
        display: none !important;
      }
    </style>
    <title>CleanFrame · Elimina marcas de agua · Neeko Studio</title>
    <script type="module" crossorigin src="./assets/index-2rnTAvN1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dukn0YXY.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Pie de Neeko Studio. Sigue al idioma que elija la aplicación. -->
    <footer
      id="neeko-footer"
      style="
        position: relative;
        z-index: 1;
        margin: 28px auto 0;
        max-width: 64rem;
        padding: 0 20px 40px;
        text-align: center;
        color: #b8b0c9;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
      "
    ></footer>
    <script>
      ;(function () {
        var el = document.getElementById('neeko-footer')
        var T = {
          es: 'CleanFrame &middot; una herramienta de',
          en: 'CleanFrame &middot; a tool by',
        }
        function paint() {
          var lang = document.documentElement.lang === 'en' ? 'en' : 'es'
          el.innerHTML =
            T[lang] +
            ' <a href="https://neekostudio.app/" style="color:#8b5cf6;text-decoration:none">Neeko Studio</a>'
        }
        paint()
        new MutationObserver(paint).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['lang'],
        })

        /* El botón «Neeko Studio» de arriba abría otra pestaña. Se convierte en
           una flecha de volver, igual que en CutFrame. */
        var FLECHA =
          '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true" style="flex:none">' +
          '<path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        function volver() {
          var chips = document.querySelectorAll('a.chip-btn')
          for (var i = 0; i < chips.length; i++) {
            var a = chips[i]
            if (!/Neeko Studio/.test(a.textContent) || a.dataset.flecha) continue
            a.dataset.flecha = '1'
            a.removeAttribute('target')
            a.removeAttribute('rel')
            a.style.display = 'inline-flex'
            a.style.alignItems = 'center'
            a.style.gap = '6px'
            a.innerHTML = FLECHA + '<span>' + a.textContent.trim() + '</span>'
          }
        }
        volver()
        new MutationObserver(volver).observe(document.getElementById('root'), {
          childList: true,
          subtree: true,
        })
      })()
    </script>
  </body>
</html>
